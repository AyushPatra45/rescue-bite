<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Food • Rescue Bite</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <h2 class="logo">Rescue Bite 🍱</h2>
    <div class="nav-links">
      <a href="role.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="smart-match.html">Smart Match</a>
      <a href="#" class="logout-btn">Logout</a>
    </div>
  </nav>

  <header class="topbar">
    <div class="brand">
      <h1>Request Food 🏢</h1>
      <p>NGOs can post urgent food needs for matching.</p>
    </div>
  </header>

  <main class="container">

    <section class="card">
      <h2>Post NGO Requirement</h2>
      <p class="muted">Submit your need and we'll match nearby donors based on location and urgency.</p>

      <form id="ngoForm" class="form">
        <input type="text"   id="ngoName"        placeholder="NGO / Organisation name" required />
        <input type="number" id="quantityNeeded" placeholder="Quantity needed (servings / packs)" min="1" required />
        <input type="text"   id="locationNGO"    placeholder="Enter your location (e.g. Velachery, Chennai)" required />

        <select id="urgency">
          <option value="High">🔴 High Urgency</option>
          <option value="Medium">🟡 Medium Urgency</option>
          <option value="Low">🟢 Low Urgency</option>
        </select>

        <button type="submit" id="requestBtn">📍 Post Request</button>
      </form>

      <div id="matchResult" class="match-result"></div>
    </section>

  </main>

  <footer class="footer">Built for good • Rescue Bite © 2026</footer>
  <div class="toast-container" id="toastContainer"></div>

  <script type="module" src="auth-guard.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
