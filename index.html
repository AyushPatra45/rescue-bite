<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Rescue Bite — Real-time food redistribution connecting donors with NGOs." />
  <title>Welcome • Rescue Bite</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Navbar (pre-login — no internal page links) -->
  <nav class="navbar">
    <h2 class="logo">Rescue Bite 🍱</h2>
    <div class="nav-links">
      <a href="#about">About</a>
      <a href="#login">Sign In</a>
    </div>
  </nav>

  <!-- Hero -->
  <header class="hero" id="about">
    <div class="hero-inner">
      <h1>Rescue Surplus.<br>Feed Hope.</h1>
      <p class="muted">
        A real-time food redistribution platform connecting donors and NGOs instantly — powered by Firebase Firestore.
      </p>

      <!-- Login Card -->
      <div class="auth-card" id="login">
        <h3>Sign in to continue</h3>
        <p class="muted" style="margin: 0 0 16px;">Enter your Firebase credentials to access the platform.</p>

        <form id="loginForm" class="form">
          <input id="loginEmail" type="email" placeholder="Email address" required />
          <input id="loginPassword" type="password" placeholder="Password" required />
          <button type="submit" id="loginBtn" class="btn-primary big-btn">Sign In →</button>
        </form>

        <div id="loginMsg" style="margin-top:12px; padding:12px 16px; border-radius:12px;
             font-weight:600; font-size:14px; display:none;"></div>
      </div>
    </div>
  </header>

  <footer class="footer">Built for good • Rescue Bite © 2026</footer>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

    // Already logged in? Skip straight to role selection
    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = "role.html";
    });

    const form     = document.getElementById("loginForm");
    const msgBox   = document.getElementById("loginMsg");
    const loginBtn = document.getElementById("loginBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email    = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value.trim();

      msgBox.style.display = "none";
      loginBtn.textContent = "Signing in…";
      loginBtn.disabled    = true;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        msgBox.style.cssText = "display:block; margin-top:12px; padding:12px 16px; border-radius:12px; font-weight:600; font-size:14px; background:rgba(34,197,94,0.12); border:1px solid rgba(34,197,94,0.3); color:#86efac;";
        msgBox.textContent = "✅ Login successful! Redirecting…";
        setTimeout(() => { window.location.href = "role.html"; }, 700);
      } catch (err) {
        msgBox.style.cssText = "display:block; margin-top:12px; padding:12px 16px; border-radius:12px; font-weight:600; font-size:14px; background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.3); color:#fca5a5;";
        msgBox.textContent = "❌ Invalid email or password. Please try again.";
        loginBtn.textContent = "Sign In →";
        loginBtn.disabled    = false;
        console.error("Login error:", err.code);
      }
    });
  </script>

</body>
</html>
